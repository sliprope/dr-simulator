<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Simulator - Phases</title>
    <link rel="stylesheet" href="https://jsdelivr.net" /> 
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        .site-container { display: flex; justify-content: space-around; align-items: center; width: 800px; margin: 50px auto; }
        .virtual-site { padding: 30px; border: 3px solid #fff; border-radius: 8px; font-size: 24px; font-weight: bold; transition: all 0.5s ease; }
        .primary-active { border-color: #4caf50; background-color: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .dr-standby    { border-color: #ff9800; background-color: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .primary-dead   { border-color: #f44336; background-color: rgba(244, 67, 54, 0.2); color: #f44336; opacity: 0.4; }
        .dr-promoted   { border-color: #4caf50; background-color: rgba(76, 175, 80, 0.2); color: #4caf50; transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="reveal"> 
        <div class="slides"> 
            <section data-auto-animate>
                <h2>Phase 1: Normal Replication</h2>
                <div class="site-container">
                    <div id="site-a" class="virtual-site primary-active">Site A (Primary)</div>
                    <div id="sync-status" style="font-size: 40px; color: #4caf50;"> ──🗄️──> </div>
                    <div id="site-b" class="virtual-site dr-standby">Site B (DR Replica)</div>
                </div>
                <p style="font-size: 18px; color: #666;">Press the Right Arrow key</p>
            </section> 
            <section data-auto-animate>
                <h2>Phase 2: Primary Outage & Failover</h2>
                <div class="site-container">
                    <div id="site-a" class="virtual-site primary-dead">Site A (Offline)</div>
                    <div id="sync-status" style="font-size: 40px; color: #f44336;"> ──❌── </div>
                    <div id="site-b" class="virtual-site dr-promoted">Site B (Active Master)</div>
                </div>
                <p style="font-size: 18px; color: #666;">Press Left Arrow to go back</p>
            </section> 
        </div> 
    </div>
    <script src="https://jsdelivr.net"></script> 
    <script> 
        Reveal.initialize({ autoAnimate: true, controls: true, progress: true, center: true, keyboard: true }); 
    </script>
</body>
</html>
